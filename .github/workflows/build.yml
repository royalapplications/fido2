name: Build
on:
  push:
    tags:
      - '1.*.*'
    paths-ignore:
      - '.github/workflows/x-*.yml'
  workflow_dispatch: # manually-triggered runs

permissions:
  # allowed to create releases (ref. https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
  contents: write

concurrency:
  # cancel pending runs when a PR gets updated (ref. https://github.com/rust-lang/rust/blob/75fd074338801fba74a8cf7f8c48c5c5be362d08/.github/workflows/ci.yml#L35)
  group: ${{ github.head_ref || github.run_id }}-${{ github.actor }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build
    runs-on: macos-latest

    env: # use tag version, if available, falling back to 1.17.0 with stable dependencies
      FIDO2_VERSION: "${{ startsWith(github.ref, 'refs/tags/1.') && github.ref_name || '1.17.0_cbor-0.14.0_openssl-3.6.5' }}"
      PUBLISH_RELEASE: "${{ startsWith(github.ref, 'refs/tags/1.') && '1' || '0' }}"

    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install pkg-config
      run: brew install pkg-config

    - name: build
      run: scripts/build.sh

    - name: publish native libraries
      uses: actions/upload-artifact@v7
      with:
        name: "fido2-${{ env.FIDO2_VERSION }}"
        retention-days: 5
        if-no-files-found: "error"
        path: |
          build/fido2-build-${{ env.FIDO2_VERSION }}/macosx/**

    - name: publish xcframework
      uses: actions/upload-artifact@v7
      with:
        name: "fido2-${{ env.FIDO2_VERSION }}.xcframework"
        retention-days: 5
        if-no-files-found: "error"
        path: |
          build/fido2-build-${{ env.FIDO2_VERSION }}/FIDO2.xcframework

    - name: pack release artifacts
      if: "success() && env.PUBLISH_RELEASE == '1'"
      run: scripts/release.sh

    - name: create release
      if: "success() && env.PUBLISH_RELEASE == '1'"
      uses: softprops/action-gh-release@v3
      with:
        name: "${{ env.FIDO2_VERSION }}"
        draft: true
        prerelease: false
        generate_release_notes: false
        fail_on_unmatched_files: true
        files: |
          build/fido2-build-${{ env.FIDO2_VERSION }}/fido2.tar.gz
          build/fido2-build-${{ env.FIDO2_VERSION }}/FIDO2.xcframework.tar.gz
